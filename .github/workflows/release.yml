name: release

permissions: {}

on:
  push:
    tags: ['v*']

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          # The tree-sitter PHP grammar is CGo, so every target is built on a
          # native runner rather than cross-compiled.
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - runner: macos-13
            goos: darwin
            goarch: amd64
          - runner: macos-14
            goos: darwin
            goarch: arm64

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe needs the tag history

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true

      - name: Build
        env:
          CGO_ENABLED: '1'
          VERSION: ${{ github.ref_name }}
        run: |
          make build VERSION="$VERSION"
          ./laravel-lsp version

      - name: Package
        env:
          NAME: laravel-lsp_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}
        run: |
          mkdir -p dist
          tar -czf "dist/$NAME.tar.gz" laravel-lsp README.md LICENSE
          shasum -a 256 "dist/$NAME.tar.gz" > "dist/$NAME.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: laravel-lsp_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    permissions:
      contents: write # required to create the GitHub release

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
